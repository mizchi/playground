<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>六つの小品</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a record sleeve. Left = track list (the back cover), right = the piano roll of the piece being played and its liner note. */
:root {
  --bg: #eceff3; --panel: #f9fafc; --ink: #1a2132; --muted: #5a6478; --line: #cdd3de;
  --c1: #2f65ad; --c2: #bd2d76; --c3: #8d6210; --c4: #177f73; --c5: #6341c4; --c6: #ad2f38; --c7: #c2410c;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f121a; --panel: #161a25; --ink: #e5e8f0; --muted: #8e97aa; --line: #2a3142;
  --c1: #7ba9ea; --c2: #f17db6; --c3: #dbad52; --c4: #5fcfbe; --c5: #a990f6; --c6: #f08488; --c7: #ff9457;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f121a; --panel: #161a25; --ink: #e5e8f0; --muted: #8e97aa; --line: #2a3142;
  --c1: #7ba9ea; --c2: #f17db6; --c3: #dbad52; --c4: #5fcfbe; --c5: #a990f6; --c6: #f08488; --c7: #ff9457;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.75 var(--body);
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px }
header { display: grid; gap: 6px }
h1 { font: 700 clamp(34px, 6vw, 52px)/1.15 var(--display); margin: 0; letter-spacing: .04em; text-wrap: balance }
.lede { color: var(--muted); max-width: 40em; margin: 0 }
.cols { display: grid; gap: 24px; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr) } .now { order: -1 } }

.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line) }
.list li { border-bottom: 1px solid var(--line) }
.row { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid;
  grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 14px 6px }
.row:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--c); outline-offset: 2px }
.row .no { font: 500 13px var(--mono); color: var(--muted) }
.row .ttl { font: 700 19px/1.4 var(--display); letter-spacing: .03em }
.row .len { font: 400 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.row .genre { grid-column: 2 / 4; font-size: 13px; color: var(--muted) }
.row[aria-current="true"] .ttl, .row[aria-current="true"] .no { color: var(--c) }
.row:hover .ttl { color: var(--c) }

.now { --c: var(--c1); display: grid; gap: 16px; background: var(--panel); border: 1px solid var(--line); padding: 20px }
.now h2 { font: 700 26px/1.3 var(--display); margin: 0; letter-spacing: .04em; color: var(--c) }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font: 400 12.5px var(--mono); color: var(--muted); margin: 0; padding: 0; list-style: none }
canvas { cursor: pointer; display: block; width: 100%; height: 220px; background: var(--bg); border: 1px solid var(--line) }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center }
.btn { all: unset; box-sizing: border-box; cursor: pointer; font: 500 13px var(--mono); padding: 8px 14px; border: 1px solid var(--ink); min-width: 3em; text-align: center }
.btn.main { background: var(--c); border-color: var(--c); color: var(--panel); min-width: 7.5em }
.btn:hover { border-color: var(--c) }
.ctl label { display: flex; align-items: center; gap: 8px; font: 400 12.5px var(--mono); color: var(--muted) }
input[type=range] { accent-color: var(--c); width: 110px }
input[type=checkbox] { accent-color: var(--c) }
.note { margin: 0; max-width: 36em }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 12px var(--mono); color: var(--muted); margin: 0; padding: 0; list-style: none }
.legend i { display: inline-block; width: 14px; height: 6px; background: var(--c); margin-right: 6px; vertical-align: middle }
footer { color: var(--muted); font-size: 13px; max-width: 44em }
</style>

<div class="wrap">
  <header>
    <h1>六つの小品</h1>
    <p class="lede">ジャンルの違う六曲と、そのうち「潮汐」と「深夜の首都高」の路線を掛け合わせた長編「環状線」を書き下ろしました。録音データは一切なく、楽譜（音名の文字列）をブラウザのシンセサイザーがその場で演奏します。</p>
  </header>

  <div class="cols">
    <ol class="list" id="list"></ol>

    <section class="now" id="now" aria-live="polite">
      <h2 id="title"></h2>
      <ul class="meta" id="meta"></ul>
      <canvas id="roll" aria-label="演奏中の曲のピアノロール"></canvas>
      <ul class="legend" id="legend"></ul>
      <div class="ctl">
        <button class="btn main" id="play" type="button">▶ 再生</button>
        <button class="btn" id="prev" type="button" aria-label="前の曲">◀◀</button>
        <button class="btn" id="next" type="button" aria-label="次の曲">▶▶</button>
        <label><input type="checkbox" id="loop"> ループ</label>
        <label>音量 <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
      </div>
      <p class="note" id="note"></p>
    </section>
  </div>

  <footer>音が出ないときは、端末の消音スイッチと音量を確認してください。曲が終わると次の曲へ進みます。ピアノロールをクリックすると、その位置から再生します。</footer>
</div>

<script>
"use strict";
/* ───────── 楽譜の書き方 ─────────
   音符は空白区切り。 c4 = ド、 bb4 = シ♭、 c#5 = ド♯。 `_3` は 3 ステップ分の長さ。
   `.` は休符、 `c4+e4+g4` は和音、 `|` は小節線（小節の長さは自動で検算する）。 */
const SEMI = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
const bars = (...b) => b.join(' | ');
const rep = (s, n) => Array(n).fill(s).join(' ');
const rest = n => Array(n).fill('._8').join(' | ');
const arp = n => rep(n.join(' '), 4);                 // 4 音 × 4 = 16 分音符 1 小節
const oct = (lo, hi) => rep(`${lo} ${hi}`, 4);        // 8 分のオクターブ・ベース
const seq = (map, names, f) => bars(...names.split(' ').map(n => f(map[n])));

/* 1. 雨宿り — lo-fi hip hop */
const lofi = (() => {
  const ch = v => `${v}_3 ${v}_5`;
  const A = ['f3+a3+c4+e4', 'f3+a3+b3+e4', 'e3+g3+b3+d4', 'g3+c#4+f4'];
  const B = ['a3+c4+e4+g4', 'ab3+c4+d4+g4', 'g3+b3+d4+e4', 'g3+b3+c#4+e4'];
  const bA = 'd2_3 d2 . a2_2 c3 | g2_3 g2 . d3_2 b2 | c2_3 c2 . g2_2 e2 | a2_3 a2 . e2_2 c#3';
  const bB = 'f2_3 f2 . c3_2 a2 | f2_3 f2 . c3_2 ab2 | e2_3 e2 . b2_2 g2 | a2_3 a2 . g2_2 e2';
  const m1 = '. . a4 c5 e5_2 d5 c5 | a4_3 . . e4 g4 a4 | b4_2 g4 e4 d4_3 .';
  return {
    id: 'lofi', title: '雨宿り', genre: 'Lo-fi Hip Hop', key: 'Dm9 – G13 – Cmaj9 – A7♭13', bpm: 76, swing: .34, lp: 3800, rev: .8, gain: .7,
    note: '軒先で雨が止むのを待つ時間。跳ねた 16 分のビートに、ローズ風のエレピが 9th と 13th を重ねます。中間部は F → Fm6 と半音だけ沈んで、少し肌寒くなる瞬間を作りました。高域をわざと削って、古いカセットの質感に寄せています。',
    tracks: [
      { name: 'メロディ', inst: 'keys', vol: .95, notes: bars(m1, '. . e4 f4 e4 c#4 a3_2',
          '. . a4 c5 e5_2 g5 e5 | d5_3 . . b4 d5 e5 | g5_2 e5 d5 b4_3 . | . c#5 e5 g5 f5_2 e5_2',
          'a5_3 g5 e5_2 c5_2 | ab5_3 g5 d5_2 c5_2 | b4_2 d5 e5 g5_3 . | . e5 c#5 a4 g4_2 e4_2',
          m1, '. . e4 f4 e4_4') },
      { name: 'エレピ', inst: 'ep', vol: .55, notes: bars(...[...A, ...A, ...B, ...A].map(ch)) },
      { name: 'ベース', inst: 'sub', vol: 1.2, notes: bars(bA, bA, bB, bA) },
    ],
    drums: { kick: 'x.....x...x.....', snare: '....x.......x...', hat: 'x.o.x.o.x.o.x.oo' },
  };
})();

/* 2. ピクセルの朝焼け — chiptune */
const chip = (() => {
  const C = { C: ['c4', 'e4', 'g4', 'c5'], G: ['b3', 'd4', 'g4', 'b4'], Am: ['a3', 'c4', 'e4', 'a4'],
    F: ['a3', 'c4', 'f4', 'a4'], Em: ['b3', 'e4', 'g4', 'b4'], E: ['b3', 'e4', 'g#4', 'b4'] };
  const R = { C: ['c2', 'c3'], G: ['g2', 'g3'], Am: ['a2', 'a3'], F: ['f2', 'f3'], Em: ['e2', 'e3'], E: ['e2', 'e3'] };
  const pA = 'C C Am Am F G C G', pB = 'F G Em Am F G E E';
  const lA = 'e5 g5 c6_2 b5 g5 e5 g5 | a5_2 g5_2 e5 d5 c5 d5 | e5 a5 c6_2 b5 a5 e5 a5 | g5_2 e5_2 c5 d5 e5 g5 | a5_3 f5 c6_2 a5_2 | b5_3 g5 d6_2 b5_2 | c6_2 e6_2 d6 c6 b5 c6 | d6_4 . g5 a5 b5';
  const lB = 'c6_3 a5 f5_2 a5_2 | b5_3 g5 d5_2 g5_2 | g5 e5 b5_2 g5 e5 g5 b5 | a5_4 . e5 a5 c6 | c6_3 a5 f6_2 e6_2 | d6_3 b5 g6_2 f6_2 | e6_2 g#5 b5 e6 g#6_3 | e6_2 d6 b5 g#5 e5 g#5 b5';
  const form = f => bars(f(pA), f(pA), f(pB), f(pA));
  return {
    id: 'chip', title: 'ピクセルの朝焼け', genre: 'Chiptune', key: 'ハ長調', bpm: 156, rev: .25, gain: .68,
    note: '矩形波 2 声と三角波、ノイズだけ。ファミコン世代の音源と同じ制約で書いた、冒険が始まる朝の曲です。中間部の最後で E メジャーに明るく転び、そこから半音ずれるようにハ長調へ戻ります。',
    tracks: [
      { name: 'リード', inst: 'sq', vol: .8, notes: bars(lA, lA, lB, lA) },
      { name: 'アルペジオ', inst: 'pulse', step: .25, vol: .42, notes: form(p => seq(C, p, arp)) },
      { name: 'ベース', inst: 'tri', vol: 1.1, notes: form(p => seq(R, p, r => oct(...r))) },
    ],
    drums: { kick: 'x...x...x...x...', snare: '....x.......x..o', hat: '..x...x...x...x.' },
  };
})();

/* 3. 二声のインヴェンション ニ短調 — baroque */
const invention = {
  id: 'inv', title: '二声のインヴェンション', genre: 'Baroque', key: 'ニ短調', bpm: 80, rev: .55, gain: 2.6,
  note: '1 小節の主題を右手が示し、左手が 1 オクターブ下で追いかけます。片方が 16 分音符で走るあいだ、もう片方は 8 分音符で支える、という役割交換が全体のルールです。ヘ長調、イ短調を経由して主調に戻り、最後の和音だけ長調に変わります（ピカルディの三度）。',
  tracks: [
    { name: '右手', inst: 'harpsi', step: .25, vol: .9, notes: bars(
      'd5 e5 f5 g5 a5_2 d5_2 c#5_2 a5_2 g5 f5 e5 f5',
      'd5_2 a5_2 f5 e5 f5 d5 e5 g5 e5 c#5 a4_2 c#5_2',
      'd5 e5 f5 g5 a5 g5 f5 e5 c5 d5 e5 f5 g5 f5 d5 e5',
      'f5_2 c5_2 a5 g5 a5 f5 g5 bb5 g5 e5 c5_2 e5_2',
      'c6_3 a5 f5_2 a5_2 d6_3 bb5 g5_2 bb5_2',
      'e6_3 c#6 a5_2 c#6_2 d6_3 a5 f5_2 a5_2',
      'a5 b5 c6 d6 e6_2 a5_2 g#5_2 e6_2 d6 c6 b5 c6',
      'a5 g5 f5 e5 d5 e5 f5 d5 g5 f5 e5 d5 c#5 d5 e5 c#5',
      'd5 e5 f5 g5 a5_2 d5_2 c#5_2 a5_2 g5 f5 e5 f5',
      'd5 f5 a5 d6 bb5 g5 e5 g5 f5 e5 d5 f5 e5_3 d5',
      'd5+f#5+a5_16') },
    { name: '左手', inst: 'harpsi', step: .25, vol: .8, notes: bars(
      'd3_4 d4_4 a3_4 a2_4',
      'd3 e3 f3 g3 a3_2 d3_2 c#3_2 a3_2 g3 f3 e3 f3',
      'd3_2 f3_2 a3_2 f3_2 e3_2 g3_2 c4_2 bb3_2',
      'f3 g3 a3 bb3 c4_2 f3_2 e3_2 c4_2 bb3 a3 g3 a3',
      'f3 a3 c4 a3 f3 a3 c4 a3 g3 bb3 d4 bb3 g3 bb3 d4 bb3',
      'a3 c#4 e4 c#4 a3 c#4 e4 c#4 d3 f3 a3 f3 d3 f3 a3 f3',
      'a3_2 e4_2 c4 b3 c4 a3 b3 d4 b3 g#3 e3_2 g#3_2',
      'a3_2 f3_2 bb3_2 g3_2 a3_2 g3_2 a3_2 a2_2',
      'd3_2 d4_2 f3_2 d3_2 a2_2 a3_2 c#3_2 a2_2',
      'd3_4 g3_4 a3_4 a2_4',
      'd2+d3_16') },
  ],
};

/* 4. 潮汐 — minimal / ambient, 7/8 */
const tide = {
  id: 'tide', title: '潮汐', genre: 'Minimal / Ambient', key: 'ニ調リディア', bpm: 96, meter: 3.5, rev: 1.5, gain: 1.4,
  note: '7 音、6 音、11 音という長さの違う 3 つの音型を、同じテンポで延々と繰り返します。周期がずれていくので、同じ素材なのに重なり方が毎回変わります。作曲したのは「ルール」だけで、旋律は干渉から勝手に生まれます。',
  tracks: [
    { name: '7 音の型', inst: 'mallet', vol: .8, notes: bars(...Array(24).fill('f#4 a4 b4 e5 c#5 a4 b4')) },
    { name: '6 音の型', inst: 'mallet', vol: .65, free: true, notes: '._12 ' + rep('d5 . f#5 e5 . a5', 26) },
    { name: '11 音の型', inst: 'bell', vol: .5, free: true, notes: '._42 ' + rep('g#5_3 . . e5_2 . c#6_2 .', 11) + ' ._5' },
    { name: 'パッド', inst: 'pad', vol: .4, free: true, notes: 'd3+a3+e4+f#4_42 b2+f#3+c#4+e4_42 e3+b3+e4+f#4_42 d3+a3+c#4+f#4_42' },
    { name: '低音', inst: 'drone', vol: .9, free: true, notes: 'd2_42 b1_42 e2_42 d2_42' },
  ],
};

/* 5. 深夜の首都高 — synthwave */
const wave = (() => {
  const P = { F: ['f4', 'a4', 'c5', 'e5'], G: ['g4', 'b4', 'd5', 'g5'], Am: ['a4', 'c5', 'e5', 'a5'],
    Em: ['e4', 'g4', 'b4', 'e5'], Dm: ['d4', 'f4', 'a4', 'd5'], E: ['e4', 'g#4', 'b4', 'e5'] };
  const D = { F: 'f3+a3+c4+e4', G: 'g3+b3+d4', Am: 'a3+c4+e4+g4', Em: 'g3+b3+e4', Dm: 'f3+a3+d4', E: 'g#3+b3+e4' };
  const R = { F: 'f2', G: 'g2', Am: 'a2', Em: 'e2', Dm: 'd2', E: 'e2' };
  const pA = 'F G Am Em', pB = 'Dm F G E';
  const form = f => bars(f(pA), f(pA), f(pA), f(pB), f(pA), f(pA));
  const lA = 'a5_3 c6_3 a5_2 | b5_3 d6_3 b5_2 | c6_2 b5 a5 e5_4 | g5_3 e5_3 b4_2 | a5_3 c6_3 f6_2 | e6_2 d6_2 b5_2 g5_2 | a5_4 c6_2 e6_2 | d6_3 b5_3 g5_2';
  const lB = 'f6_4 e6_2 d6_2 | c6_4 a5_2 c6_2 | d6_3 b5_3 d6_2 | e6_4 g#5_2 b5_2';
  return {
    id: 'wave', title: '深夜の首都高', genre: 'Synthwave', key: 'イ短調', bpm: 104, rev: 1, gain: .72,
    note: '80 年代のアナログシンセを意識した、夜のドライブ用の曲。16 分で刻むノコギリ波のベースと、3+3+2 で区切るリードの組み合わせが推進力です。最初の 4 小節は伴奏だけで、トンネルを抜けたところで旋律が入ります。',
    tracks: [
      { name: 'リード', inst: 'lead', vol: .7, notes: bars(rest(4), lA, lB, lA) },
      { name: 'アルペジオ', inst: 'pluck', step: .25, vol: .5, notes: form(p => seq(P, p, arp)) },
      { name: 'パッド', inst: 'pad', vol: .3, notes: form(p => seq(D, p, c => `${c}_8`)) },
      { name: 'ベース', inst: 'sawbass', step: .25, vol: .85, notes: form(p => seq(R, p, r => rep(r, 16))) },
    ],
    drums: { kick: 'x...x...x...x...', snare: '....x.......x...', hat: '..x...x...x...xo' }, drumSend: .35,
  };
})();

/* 6. 宵の庭 — 都節音階 */
const garden = {
  id: 'niwa', title: '宵の庭', genre: '和風（都節音階）', key: 'D – E♭ – G – A – B♭', bpm: 66, rev: 1.4, gain: .9,
  note: '箏の調弦でおなじみの都節音階だけで書きました。半音（D–E♭、A–B♭）が陰りを生みます。前半は箏の独奏、5 小節目から尺八風の笛が長い音で重なります。拍は 4 拍子ですが、間（ま）を聴かせるためにあえて音を置かない場所を残しています。',
  tracks: [
    { name: '箏', inst: 'koto', vol: .9, notes: bars(
      'd4 a4 bb4 a4 g4_2 eb4_2', 'd4_2 a3 bb3 d4_4', 'g4 a4 bb4 d5 eb5_2 d5_2', 'bb4 a4 g4 eb4 d4_4',
      'd5 eb5 d5 bb4 a4_2 g4_2', 'a4 bb4 a4 g4 eb4_2 d4_2', 'd4 g4 a4 d5 eb5 d5 bb4 a4', 'g4_2 eb4_2 d4_4',
      'd4 a4 bb4 a4 g4_2 eb4_2', 'd4_2 a3 bb3 d4_4', 'g4 a4 bb4 d5 eb5_2 d5_2', 'd4+a4+d5_8') },
    { name: '笛', inst: 'flute', vol: .55, notes: bars(rest(4),
      'a5_6 bb5_2', 'a5_4 g5_4', 'd6_6 eb6_2', 'd6_8', 'bb5_3 a5 g5_4', 'eb5_4 d5_4', 'g5_2 a5_2 bb5_4', 'a5_8') },
    { name: '持続音', inst: 'drone', vol: .7, free: true, notes: rep('d2+a2_16', 6) },
  ],
  drums: { taiko: 'x' + '.'.repeat(27) + 'o...' },
};

/* 7. 環状線 — minimal synthwave（長編） */
const loopline = (() => {
  const NB = 84, NAMES = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
  const shift = (s, n) => s.replace(/[a-g][#b]?\d/g, x => { const m = midi(x) + n; return NAMES[m % 12] + (Math.floor(m / 12) - 1); });
  // 和音ごとの 7 音の「音の池」。音型は池の何番目を弾くかだけを決めている

  if (e.drum === 'kick') tone('sine', 150, 45, .1, .3).connect(env(.8 * v, .3));
  else if (e.drum === 'snare') { noise(.18, 'bandpass', 1900).connect(env(.5 * v, .18)); tone('triangle', 220, 160, .05, .1).connect(env(.25 * v, .1)); }
  else if (e.drum === 'hat') noise(.05, 'highpass', 7000).connect(env(.16 * v, .05));
  else if (e.drum === 'taiko') { const g = env(.8 * v, 1); tone('sine', 95, 48, .25, 1).connect(g);
    noise(.1, 'lowpass', 500).connect(env(.5 * v, .1)); const s = ctx.createGain(); s.gain.value = .5; g.connect(s).connect(bus.wet); }
  else if (e.drum === 'crash') { const g = env(.3 * v, 2.2); noise(2.2, 'highpass', 4500).connect(g);
    const s = ctx.createGain(); s.gain.value = .6; g.connect(s).connect(bus.wet); }
  else if (e.drum === 'riser') { const f = noise(e.d, 'bandpass', 300), g = ctx.createGain(); f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(7000, t + e.d);
    g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.28 * v, t + e.d); g.gain.setTargetAtTime(0, t + e.d, .02);
    f.connect(g); g.connect(bus.dry); g.connect(bus.wet); }
  if (e.drum === 'kick') for (const [p, amt] of bus.duckers) { p.setValueAtTime(1 - amt * v, t); p.linearRampToValueAtTime(1, t + .26); }
}
const fire = (R, bus, e, t) => e.drum ? playDrum(R, bus, e, t) : playNote(R, bus, e, t);

/* 検証用: 音を鳴らさずに 1 曲まるごとレンダリングして音量を測る */
async function renderOffline(song) {
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(sr * (song.len + 3)), sr);
  const R = makeRig(ctx), bus = makeBus(R, song);
  R.master.gain.value = .8; scheduleAuto(bus, song, .05, 0, 0);
  let idx = 0;                                        // 実再生と同じく 2 秒ぶんずつ予約する
  const chunk = T => { while (idx < song.ev.length && song.ev[idx].t < T + 2) { const e = song.ev[idx++]; fire(R, bus, e, e.t + .05); } };
  chunk(0);
  for (let T = 2; T < song.len; T += 2) ctx.suspend(T).then(() => { chunk(T); ctx.resume(); });
  const d = (await ctx.startRendering()).getChannelData(0);
  let peak = 0, sq = 0;
  for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; sq += a * a; }
  return { id: song.id, sec: +song.len.toFixed(1), events: song.ev.length, peak: +peak.toFixed(3), rms: +Math.sqrt(sq / d.length).toFixed(4) };
}
window.__verify = async () => ({ errors, songs: await SONGS.reduce(async (acc, x) => [...await acc, await renderOffline(x)], []) });

/* ───────── プレイヤー ───────── */
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
let rig = null, cur = 0, play = null;   // play = { bus, t0, idx, lap, timer }

function stop() {
  if (!play) return;
  clearInterval(play.timer);
  const { bus } = play, now = rig.ctx.currentTime;
  for (const g of [bus.out, bus.wet]) g.gain.setTargetAtTime(0, now, .02);
  setTimeout(() => { bus.out.disconnect(); bus.wet.disconnect(); }, 400);
  play = null; $('play').textContent = '▶ 再生';
}
function start(off = 0) {
  if (!rig) { rig = makeRig(new (window.AudioContext || window.webkitAudioContext)()); rig.master.gain.value = +$('vol').value; }
  rig.ctx.resume(); stop();
  const song = SONGS[cur], t1 = rig.ctx.currentTime + .12, p = play = { bus: makeBus(rig, song), t0: t1 - off, idx: 0, lap: 0 };
  scheduleAuto(p.bus, song, p.t0, off, t1);
  for (const e of song.ev) {                          // 途中から: すでに鳴っているはずの長い音を拾う
    if (e.t >= off) break; p.idx++;
    if (!e.drum && e.t + e.d > off + .25) fire(rig, p.bus, { ...e, d: e.t + e.d - off }, t1);
  }
  const tick = () => {
    const now = rig.ctx.currentTime;
    for (;;) {
      if (p.idx >= song.ev.length) {
        if ($('loop').checked) { p.idx = 0; p.lap++; scheduleAuto(p.bus, song, p.t0 + p.lap * song.len, 0, now); continue; }
        if (now > p.t0 + (p.lap + 1) * song.len + 1.2) { select((cur + 1) % SONGS.length, true); }
        return;
      }
      const e = song.ev[p.idx], t = p.t0 + p.lap * song.len + e.t;
      if (t > now + .35) return;
      fire(rig, p.bus, e, Math.max(t, now)); p.idx++;
    }
  };
  p.timer = setInterval(tick, 60); tick();
  $('play').textContent = '■ 停止';
}

function select(i, autoplay) {
  const was = !!play; stop(); cur = i;
  const s = SONGS[i], c = `var(--c${i + 1})`;
  $('now').style.setProperty('--c', c);
  $('title').textContent = s.title;
  $('note').textContent = s.note;
  $('meta').innerHTML = [s.genre, s.key, `${s.bpm} BPM`, s.meter ? '7/8 拍子' : '4/4 拍子', `${s.nbars} 小節`, fmt(s.len)]
    .map(x => `<li>${x}</li>`).join('');
  $('legend').innerHTML = s.tracks.map((t, k) => `<li><i style="opacity:${t.alpha ?? ALPHA[k]}"></i>${t.name}</li>`).join('')
    + (s.drums ? '<li><i style="opacity:.3;height:2px"></i>打楽器</li>' : '');
  document.querySelectorAll('.row').forEach((r, k) => r.setAttribute('aria-current', k === i));
  drawRoll();
  if (autoplay || was) start();
}

/* ピアノロール: 横が時間、縦が音高。再生位置を縦線で示す */
const ALPHA = [1, .62, .42, .3, .22];
const cv = $('roll'), g2 = cv.getContext('2d'), base = document.createElement('canvas');
function drawRoll() {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  for (const c of [cv, base]) { c.width = w * dpr; c.height = h * dpr; }
  const s = SONGS[cur], g = base.getContext('2d'), css = getComputedStyle($('now'));
  const col = css.getPropertyValue(`--c${cur + 1}`).trim(), line = css.getPropertyValue('--line').trim();
  g.scale(dpr, dpr);
  const top = s.sections ? 20 : 6, dh = s.drums ? 14 : 0, rows = s.hi - s.lo + 1, rh = (h - dh - top - 6) / rows;
  g.fillStyle = line;
  for (let b = 0; b <= s.nbars; b += s.nbars > 40 ? 4 : 1) g.fillRect(Math.round(b / s.nbars * (w - 1)), 0, 1, h);
  g.font = '11px "DM Mono", ui-monospace, monospace';
  for (const [b, name] of s.sections || []) { const x = Math.round(b / s.nbars * (w - 1));
    g.fillStyle = css.getPropertyValue('--muted'); g.fillRect(x, 0, 1, h); g.fillText(name, x + 5, 13); }
  g.fillStyle = col;
  for (const e of s.ev) {
    const x = e.t / s.len * w;
    if (e.drum) { g.globalAlpha = .3 * e.v + .1; g.fillRect(x, h - dh + 2, 1.5, dh - 5); continue; }
    g.globalAlpha = s.tracks[e.k].alpha ?? ALPHA[e.k];
    g.fillRect(x, top + (s.hi - e.m) * rh, Math.max(1.5, e.d / s.len * w - 1), Math.max(1.5, rh - .5));
  }
  paint();
}
function paint() {
  g2.clearRect(0, 0, cv.width, cv.height); g2.drawImage(base, 0, 0);
  if (play && rig) {
    const s = SONGS[cur], pos = (rig.ctx.currentTime - play.t0) / s.len;
    if (pos >= 0 && (pos <= 1 || $('loop').checked)) {
      g2.fillStyle = getComputedStyle($('now')).getPropertyValue('--ink');
      g2.fillRect(Math.round((pos % 1) * (cv.width - 2)), 0, 2, cv.height);
    }
  }
}
(function loop() { paint(); requestAnimationFrame(loop); })();

$('list').innerHTML = SONGS.map((s, i) =>
  `<li><button class="row" type="button" style="--c:var(--c${i + 1})"><span class="no">${String(i + 1).padStart(2, '0')}</span><span class="ttl">${s.title}</span><span class="len">${fmt(s.len)}</span><span class="genre">${s.genre}</span></button></li>`).join('');
document.querySelectorAll('.row').forEach((r, i) => r.addEventListener('click', () => select(i, true)));
$('play').addEventListener('click', () => play ? stop() : start());
$('prev').addEventListener('click', () => select((cur + SONGS.length - 1) % SONGS.length));
$('next').addEventListener('click', () => select((cur + 1) % SONGS.length));
$('vol').addEventListener('input', e => { if (rig) rig.master.gain.setTargetAtTime(+e.target.value, rig.ctx.currentTime, .02); });
cv.addEventListener('click', e => { const r = cv.getBoundingClientRect(); start(Math.max(0, (e.clientX - r.left) / r.width) * SONGS[cur].len); });
addEventListener('resize', drawRoll);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawRoll);
new MutationObserver(drawRoll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
select(SONGS.length - 1);
if (document.fonts) document.fonts.ready.then(drawRoll);
</script>
