[package]
name = "crustc"
version = "0.1.0"
edition = "2024"
# examples/ は crustc でコンパイルする入力 (Cargo の example ではない。no_std のものもある)
autoexamples = false

# 他の実験と干渉しないよう、このディレクトリ単独のワークスペースにする
[workspace]

[features]
# 移植中の syn・Cranelift を使わないコード生成 (src/acg) とドライバ (src/driver2.rs)
acg = []

[dependencies]
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit", "clone-impls"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
cranelift-codegen = { version = "0.137", default-features = false, features = ["std", "host-arch", "unwind"] }
cranelift-frontend = "0.137"
cranelift-module = "0.137"
cranelift-object = "0.137"
cranelift-native = "0.137"
serde_json = "1"
quote = { version = "1", default-features = false }
# .o の .text を SHF_COMPRESSED (zstd) にする (wild は解凍して読む)
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compile"
harness = false

[profile.release]
debug = false
