[package]
name = "crustc"
version = "0.1.0"
edition = "2024"
# examples/ は crustc でコンパイルする入力 (Cargo の example ではない。no_std のものもある)
autoexamples = false

# 他の実験と干渉しないよう、このディレクトリ単独のワークスペースにする
[workspace]
members = ["crates/minclif", "crates/core", "crates/clif"]

[features]
# (以前は driver2 を有効にする feature。今は常に入っている: テストの cfg のために残す)
default = ["acg"]
acg = []

[dependencies]
crustc-core = { path = "crates/core" }
crustc-clif = { path = "crates/clif" }
serde_json = "1"
minclif = { path = "crates/minclif" }

[dev-dependencies]
# (テストが syn 版と比べるのに使う)
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit", "clone-impls"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compile"
harness = false

[profile.release]
debug = false
