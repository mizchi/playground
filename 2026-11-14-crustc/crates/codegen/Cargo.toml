[package]
name = "crustc-codegen"
version = "0.1.0"
edition = "2024"
description = "crustc のコード生成: acg (構文木 → minclif の命令の列。型の検査もここ)、Blob の直列化、リンク"

[dependencies]
crustc-sema = { path = "../sema" }
minclif = { path = "../minclif" }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
