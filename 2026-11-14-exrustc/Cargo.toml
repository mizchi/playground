[package]
name = "exrustc"
version = "0.1.0"
edition = "2024"

# 他の実験と干渉しないよう、このディレクトリ単独のワークスペースにする
[workspace]

[dependencies]
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
cranelift-codegen = { version = "0.137", default-features = false, features = ["std", "host-arch", "unwind"] }
cranelift-frontend = "0.137"
cranelift-module = "0.137"
cranelift-object = "0.137"
cranelift-native = "0.137"

[profile.release]
debug = false
