<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Native Desktop</title>
    <style>
      :root {
        --c-bg: #eef0f4;
        --c-surface: #ffffff;
        --c-text: #1d2230;
        --c-muted: #5d6475;
        --c-accent: #3557d4;
        --c-accentText: #ffffff;
        --c-border: #c9ced9;
        --c-danger: #c2362f;
        --c-ghost: #b4529a;
        --panel: #f8f9fb;
        color-scheme: light dark;
      }
      /* ダーク: OS の設定に従う (data-theme="light" で明示したときを除く)。値は src/theme.ts と同じ (test/theme.test.ts が確かめる) */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --c-bg: #15171d;
          --c-surface: #1f222b;
          --c-text: #e6e8ef;
          --c-muted: #9aa1b2;
          --c-accent: #7d97ff;
          --c-accentText: #10131a;
          --c-border: #3a3f4d;
          --c-danger: #ff7a70;
          --c-ghost: #e48ad0;
          --panel: #1a1c23;
        }
      }
      /* 明示したダーク (パネルのテーマの切り替え) */
      :root[data-theme="dark"] {
        color-scheme: dark;
        --c-bg: #15171d;
        --c-surface: #1f222b;
        --c-text: #e6e8ef;
        --c-muted: #9aa1b2;
        --c-accent: #7d97ff;
        --c-accentText: #10131a;
        --c-border: #3a3f4d;
        --c-danger: #ff7a70;
        --c-ghost: #e48ad0;
        --panel: #1a1c23;
      }
      :root[data-theme="light"] { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        font: 13px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: var(--c-bg);
        color: var(--c-text);
      }
      #stage { position: relative; min-width: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      /* IME の受け口。見えないがキャレットの位置に置く */
      #sink {
        position: absolute; width: 1px; height: 18px; padding: 0; border: 0; outline: 0;
        opacity: 0; resize: none; overflow: hidden; caret-color: transparent; left: 0; top: 0;
      }
      /* スクリーンリーダー向けのミラー DOM: 見えないが、アクセシビリティツリーには出る。位置は widget に重ねる */
      #a11y { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      #a11y [style] { position: absolute; }
      #a11y * { color: transparent; background: transparent; border: 0; margin: 0; padding: 0; font-size: 1px; outline: none; }
      #a11y .live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      aside {
        background: var(--panel);
        border-left: 1px solid var(--c-border);
        overflow-y: auto;
        padding: 12px 14px 40px;
      }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-muted); margin: 18px 0 6px; }
      h2:first-child { margin-top: 0; }
      textarea.json, pre {
        width: 100%; font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--c-surface); color: var(--c-text); border: 1px solid var(--c-border); border-radius: 6px; padding: 6px 8px;
      }
      textarea.json { height: 130px; resize: vertical; }
      pre { max-height: 220px; overflow: auto; margin: 0; white-space: pre-wrap; word-break: break-all; }
      button, select {
        font: inherit; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text);
        border-radius: 6px; padding: 3px 9px; cursor: pointer;
      }
      button.primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accentText); }
      select { max-width: 100%; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
      .card { border: 1px solid var(--c-border); background: var(--c-surface); border-radius: 8px; padding: 8px; margin: 6px 0; }
      .card.sensitive { border-color: var(--c-danger); }
      .muted { color: var(--c-muted); }
      .err { color: var(--c-danger); white-space: pre-wrap; }
      .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--c-border); }
      ol { margin: 4px 0; padding-left: 20px; }
      @media (max-width: 760px) {
        body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
        aside { border-left: 0; border-top: 1px solid var(--c-border); }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" aria-hidden="true"></canvas>
      <textarea id="sink" aria-label="入力" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      <div id="a11y"></div>
    </div>
    <aside id="panel"></aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
